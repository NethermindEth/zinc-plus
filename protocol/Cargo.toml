[package]
name = "zinc-protocol"
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
crypto-primitives = { workspace = true }
rayon = { workspace = true, optional = true }
itertools = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
zip-plus = { workspace = true }
zinc-piop = { workspace = true }
zinc-poly = { workspace = true }
zinc-primality = { workspace = true }
zinc-transcript = { workspace = true }
zinc-uair = { workspace = true }
zinc-utils = { workspace = true }
# Optional: bolt-rs (ligerito-derived Reed-Solomon encoder) for the
# `Commit-Encode-RS` micro bench. Local path dep, activated by the
# `bolt_rs_compare` feature. Dev-only in spirit but declared as a
# regular dep because cargo doesn't allow `optional` on dev-deps.
bolt-rs = { path = "/Users/albertgarretafontelles/bolt-rs", default-features = false, optional = true }

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true }
crypto-bigint = { workspace = true }
rand = { workspace = true }
zinc-test-uair = { workspace = true }
zstd = "0.13"
libc = "0.2"

[lints]
workspace = true


[features]
parallel = ["dep:rayon", "zinc-piop/parallel", "zinc-poly/parallel", "zinc-uair/parallel", "zinc-utils/parallel", "zinc-test-uair/parallel"]
simd = ["zinc-poly/simd", "zinc-piop/simd", "zip-plus/simd"]
unchecked = []
# Metal GPU Blake3 leaf-hash path in the commit phase. macOS-only.
# Forwarded to `zip-plus/metal_gpu`. Used by the `Commit-Fused-GPU`
# micro bench entry in `benches/f2_sha256.rs`.
metal_gpu = ["zip-plus/metal_gpu"]
# Switch the IPRS bench code from inverse-rate 4 (rate 1/4) to inverse-rate 8
# (rate 1/8). Affects every `IprsCode<..., REP, ...>` instance in `benches/e2e.rs`.
iprs-rate-1-8 = []
# Switch the IPRS bench code to inverse-rate 16 (rate 1/16). Takes precedence
# over `iprs-rate-1-8` if both are enabled.
iprs-rate-1-16 = []
# Enable the `Commit-Encode-RS` micro bench entry that benchmarks
# bolt-rs / ligerito-derived Reed-Solomon encoding at the same shape
# as the F_2 commit `Commit-Encode` entry. Pulls in `bolt-rs` as a
# local path dep; off by default.
bolt_rs_compare = ["dep:bolt-rs"]

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "f2_sha256"
harness = false
# This bench is always run with the full perf-tuned feature set; running
# it without these would yield numbers that don't reflect deployable
# performance. Pair with `cargo bench -p zinc-protocol --bench f2_sha256
# --features parallel,simd,unchecked`.
required-features = ["parallel", "simd", "unchecked"]

[[bench]]
name = "f2_sha256_rs"
harness = false
# Reed-Solomon-equivalent variant of `f2_sha256`: same code path, but
# with `BENCH_NUM_OPENINGS = 200` instead of `987`, mirroring the
# column-opening count an MDS code would let the protocol use. Groups
# are suffixed " RS" to avoid Criterion baseline collisions with the
# RAA bench. Pair with `cargo bench -p zinc-protocol --bench
# f2_sha256_rs --features parallel,simd,unchecked`.
required-features = ["parallel", "simd", "unchecked"]

[[bench]]
name = "f2_blake3"
harness = false
# Sibling to f2_sha256. Same perf-tuning requirements; pair with
# `cargo bench -p zinc-protocol --bench f2_blake3
# --features parallel,simd,unchecked`.
required-features = ["parallel", "simd", "unchecked"]
