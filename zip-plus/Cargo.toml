[package]
name = "zip-plus"
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
crypto-primitives = { workspace = true }
zinc-poly = { workspace = true }
zinc-primality = { workspace = true }
zinc-transcript = { workspace = true }
zinc-utils = { workspace = true }

ark-ff = { version = "0.5.0", default-features = false }
ark-poly = { version = "0.5.0", default-features = false }

itertools = { workspace = true }
thiserror = { workspace = true }
crypto-bigint = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true, optional = true }
blake3 = { workspace = true }
uninit = "0.6.2"

# Optional Metal GPU backend (macOS only). Adapted from
# `albertgarreta/bolt-rs` — see `src/metal_gpu/` for the Blake3 leaf-hash
# kernel and the dispatch wrapper.
metal = { version = "0.31", optional = true }
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }

# Compression libraries, used only to estimate compressed proof sizes
zstd = "0.13"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

[features]
parallel = ["dep:rayon", "zinc-utils/parallel", "zinc-poly/parallel", "ark-ff/parallel", "ark-poly/parallel"]
simd = ["zinc-poly/simd"]
unchecked = []
# Metal GPU Blake3 leaf-hash path for the commit phase. macOS-only.
# When disabled, the GPU module is omitted and only the CPU path is built.
metal_gpu = ["dep:metal", "dep:objc", "dep:block"]

[[bench]]
name = "zip_benches"
harness = false

[[bench]]
name = "zip_plus_benches"
harness = false
